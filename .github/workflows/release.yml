name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack skills
        run: |
          mkdir dist
          cd plugins/checkcheck/skills
          for d in */; do
            zip -r "../../../dist/${d%/}.zip" "${d%/}" -x '*/__pycache__/*'
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
